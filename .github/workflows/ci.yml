name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: ruff check src/dairack tests
      - run: ruff format --check src/dairack tests
      - run: python -m pytest -q
        env:
          DAIRACK_HOME: ${{ runner.temp }}/dairack-test-state
      - run: python -m build
        if: matrix.python-version == '3.13'
      - run: python -m twine check dist/*
        if: matrix.python-version == '3.13'

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: ruff check src/dairack tests
      - run: ruff format --check src/dairack tests
      - run: python -m pytest -q
        env:
          DAIRACK_HOME: ${{ runner.temp }}\dairack-test-state

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: ruff check src/dairack tests
      - run: ruff format --check src/dairack tests
      - run: python -m pytest -q
        env:
          DAIRACK_HOME: ${{ runner.temp }}/dairack-test-state
